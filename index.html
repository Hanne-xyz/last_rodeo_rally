<style>
/* Layout: one-column field guide, sticky header with unit switch, bottom tab bar; stops read like a mile-marker log. */
:root{
  --bg:#EDF0EA; --surface:#FFFFFF; --sunk:#E1E6DE; --ink:#18201B; --muted:#56635A; --line:#C9D1C6;
  --accent:#0B7A75; --accent-ink:#FFFFFF; --accent-soft:#D3ECE9;
  --water:#1D6FB8; --water-soft:#DDEBF7; --warn:#A65F00; --warn-soft:#FBEBD2; --bad:#B42318; --bad-soft:#FBE1DE; --ok:#2E7D32;
  --profile:#7A8F7F; --profile-fill:#C9D4C6;
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121714; --surface:#1B221D; --sunk:#232C26; --ink:#E8EEE8; --muted:#9DAAA0; --line:#334038;
  --accent:#4FC2BA; --accent-ink:#0B1A18; --accent-soft:#163633;
  --water:#6FB1EE; --water-soft:#16283A; --warn:#F0B35A; --warn-soft:#33270F; --bad:#F2877C; --bad-soft:#3A1814; --ok:#7CC981;
  --profile:#7FA08A; --profile-fill:#2A3A30; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121714; --surface:#1B221D; --sunk:#232C26; --ink:#E8EEE8; --muted:#9DAAA0; --line:#334038;
  --accent:#4FC2BA; --accent-ink:#0B1A18; --accent-soft:#163633;
  --water:#6FB1EE; --water-soft:#16283A; --warn:#F0B35A; --warn-soft:#33270F; --bad:#F2877C; --bad-soft:#3A1814; --ok:#7CC981;
  --profile:#7FA08A; --profile-fill:#2A3A30; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0 96px;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--f-display);font-weight:900;font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.units{display:flex;background:var(--sunk);border-radius:999px;padding:3px}
.units button{border:0;background:transparent;padding:7px 12px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;min-height:36px}
.units button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;letter-spacing:.03em}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
section.view{display:flex;flex-direction:column;gap:16px;padding-top:16px}

.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sub{color:var(--muted);font-size:14px}
.alt{color:var(--muted);font-size:.78em;font-weight:500;margin-left:.35em;white-space:nowrap}

/* day chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* position */
.pos-row{display:flex;align-items:center;gap:12px}
.pos-row input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:36px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);font-size:20px;font-weight:700;cursor:pointer}
.pos-val{font-family:var(--f-num);font-size:28px;font-weight:600;min-width:5ch;text-align:center}
.pos-val small{display:block;font-size:12px;color:var(--muted);font-weight:500}

.next{display:grid;grid-template-columns:1fr;gap:10px}
.nx{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--sunk)}
.nx .ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center}
.nx .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nx.w .ic{background:var(--water-soft);color:var(--water)}
.nx.f .ic{background:var(--accent-soft);color:var(--accent)}
.nx.s .ic{background:var(--warn-soft);color:var(--warn)}
.nx .t{min-width:0}
.nx .t b{display:block;overflow-wrap:anywhere}
.nx .t span{font-size:13px;color:var(--muted)}
.nx .d{text-align:right;font-family:var(--f-num);font-weight:600;font-size:22px;line-height:1.05}
.nx .d small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.nx.alarm{outline:2px solid var(--bad);background:var(--bad-soft)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:10px;padding:10px;min-width:0}
.stat .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--f-num);font-weight:600;font-size:19px;line-height:1.15}
.stat .v small{display:block;font-size:12px;color:var(--muted);font-weight:500}

/* profile */
.profile{width:100%;height:auto;display:block}
.profile .area{fill:var(--profile-fill)}
.profile .line{fill:none;stroke:var(--profile);stroke-width:1.5}
.profile .done{fill:var(--accent);opacity:.22}
.profile .grid{stroke:var(--line);stroke-width:1}
.profile text{fill:var(--muted);font-family:var(--f-num);font-size:10px}
.profile .mk{stroke:var(--surface);stroke-width:1.5}
.profile .mk.w{fill:var(--water)} .profile .mk.f{fill:var(--accent)} .profile .mk.s{fill:var(--warn)} .profile .mk.x{fill:var(--muted)}
.profile .me{stroke:var(--bad);stroke-width:2}

/* stops log */
.log{display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.stop:first-child{border-top:0}
.stop.past{opacity:.5}
.mile{font-family:var(--f-num);font-weight:600;font-size:15px;line-height:1.1}
.mile small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.stop h3{font-family:var(--f-body);font-size:16px;font-weight:700;letter-spacing:0}
.stop p{margin:4px 0 0;font-size:14.5px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.food{background:var(--accent-soft);color:var(--accent)}
.tag.water{background:var(--water-soft);color:var(--water)}
.tag.camp,.tag.bed{background:var(--warn-soft);color:var(--warn)}
.tag.nowater,.tag.danger{background:var(--bad-soft);color:var(--bad)}
.tag.off{background:transparent;border:1px solid var(--line)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13.5px;margin-top:8px}
.meta dt{color:var(--muted);font-weight:700}
.meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.lnk{color:var(--accent);font-weight:700;text-underline-offset:2px}
.src{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.03em}

/* stage list */
.stage{display:flex;flex-direction:column;gap:12px}
.stage-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.stage-head h2{font-size:30px;font-weight:900;text-transform:uppercase;line-height:1}
.stage-head .n{font-family:var(--f-display);font-weight:900;font-size:16px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.route{font-size:15px;font-weight:700}
.night{border-radius:10px;padding:12px;background:var(--warn-soft);font-size:14.5px}
.night b{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--warn);margin-bottom:3px}
details.more>summary{cursor:pointer;font-weight:700;color:var(--accent);list-style:none;min-height:40px;display:flex;align-items:center}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+";display:inline-block;width:1.2em;font-family:var(--f-num)}
details.more[open]>summary::before{content:"–"}

.alert{border-radius:12px;padding:14px;background:var(--bad-soft);color:var(--ink);border:1px solid var(--bad);display:flex;flex-direction:column;gap:6px}
.alert b.h{color:var(--bad);font-size:13px;letter-spacing:.07em;text-transform:uppercase}
.alert.w{background:var(--warn-soft);border-color:var(--warn)}
.alert.w b.h{color:var(--warn)}
.alert ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}

.filters{display:flex;gap:6px;flex-wrap:wrap}
.gap-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.gap-row:first-of-type{border-top:0}
.gap-row .d{font-family:var(--f-num);font-weight:600;text-align:right}
.gap-row .d small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.hint{font-size:13px;color:var(--muted)}
.big-h{font-size:34px;font-weight:900;text-transform:uppercase;line-height:.95}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}

/* ---------- units ---------- */
const KM_MI=0.621371, M_FT=3.28084;
let imperial=false, view="now", day=1, posKm=0, filter="all";
try{const s=JSON.parse(localStorage.getItem("rodeo")||"{}");imperial=!!s.imperial;view=s.view||"now";day=s.day||1;posKm=s.posKm||0;filter=s.filter||"all"}catch(e){}
function save(){try{localStorage.setItem("rodeo",JSON.stringify({imperial,view,day,posKm,filter}))}catch(e){}}

const fmt=(v,dec)=>v.toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec});
function dist(km,dec){ dec = dec ?? (km<10?1:0);
  const a=fmt(km,dec)+" km", b=fmt(km*KM_MI,dec)+" mi";
  return imperial? b+'<span class="alt">'+a+'</span>' : a+'<span class="alt">'+b+'</span>'; }
function distStack(km){ const dec=km<10?1:0; const a=fmt(km,dec)+" km", b=fmt(km*KM_MI,dec)+" mi";
  return imperial? b+"<small>"+a+"</small>" : a+"<small>"+b+"</small>"; }
function elev(m){ const a=fmt(Math.round(m),0)+" m", b=fmt(Math.round(m*M_FT/10)*10,0)+" ft";
  return imperial? b+'<span class="alt">'+a+'</span>' : a+'<span class="alt">'+b+'</span>'; }
function elevStack(m){ const a=fmt(Math.round(m),0)+" m", b=fmt(Math.round(m*M_FT/10)*10,0)+" ft";
  return imperial? b+"<small>"+a+"</small>" : a+"<small>"+b+"</small>"; }
function short(km){ return imperial? fmt(km*KM_MI,km<10?1:0) : fmt(km,km<10?1:0); }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const CAT={food:"Food",water:"Water",camp:"Camping",bed:"Lodging",bike:"Bike shop",info:"Info"};
const ICON={
  w:'<svg viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>',
  f:'<svg viewBox="0 0 24 24"><path d="M6 3v8a2 2 0 0 0 2 2v8M10 3v8M8 3v8M17 21V3c-2 1-3 4-3 8h3"/></svg>',
  s:'<svg viewBox="0 0 24 24"><path d="M3 20h18M5 20l7-15 7 15M12 5v15"/></svg>'
};
function markClass(s){ if(s.c.includes("water")&&s.wq!=="no") return "w"; if(s.c.includes("food")) return "f"; if(s.c.includes("camp")||s.c.includes("bed")) return "s"; return "x"; }

function tagsHtml(s){
  let t=s.c.map(c=>`<span class="tag ${c}">${CAT[c]}</span>`).join("");
  if(s.wq==="no") t+=`<span class="tag nowater">No water</span>`;
  if(s.wq==="warn") t+=`<span class="tag danger">Treat water</span>`;
  if(s.off>=0.5) t+=`<span class="tag off">${imperial?fmt(s.off*KM_MI,1)+" mi":fmt(s.off,1)+" km"} off route (straight line)</span>`;
  return t;
}
function stopHtml(s,past){
  const meta=[["Hours",s.hours],["Price",s.price],["Payment",s.cash],["Cell",s.cell]].filter(x=>x[1]);
  const rk = s.r!=null ? `<small>Guide ${imperial?fmt(s.r*KM_MI,0)+" mi":s.r+" km"}</small>` : "";
  return `<div class="stop${past?" past":""}">
    <div class="mile">${s.approx?"≈":""}${short(s.k)}<small>${imperial?"mi":"km"} · D${s.d}</small>${rk}</div>
    <div><h3>${esc(s.n)}</h3><p>${esc(s.i)}</p>${s.link?`<p><a class="lnk" href="${esc(s.link.href)}" target="_blank" rel="noopener">${esc(s.link.text)}</a></p>`:""}<div class="tags">${tagsHtml(s)}</div>
    ${meta.length?`<dl class="meta">${meta.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`:""}</div></div>`;
}

/* ---------- profile ---------- */
function profileSvg(D,opts={}){
  const W=340,H=opts.h||110,pl=30,pr=6,pt=8,pb=18;
  const lo=Math.floor(D.min/200)*200, hi=Math.ceil(D.max/200)*200;
  const x=k=>pl+(k/D.km)*(W-pl-pr), y=e=>pt+(1-(e-lo)/(hi-lo))*(H-pt-pb);
  const pts=D.prof.map((e,i)=>[x(D.km*i/100),y(e)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
  const area=line+`L${x(D.km).toFixed(1)} ${H-pb}L${pl} ${H-pb}Z`;
  let g="";
  const step=(hi-lo)>1000?500:200;
  for(let e=lo;e<=hi;e+=step){ const yy=y(e).toFixed(1); const lab=imperial?Math.round(e*M_FT/100)/10+"k":e;
    g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text x="${pl-4}" y="${+yy+3}" text-anchor="end">${lab}</text>`; }
  const tot=imperial?D.km*KM_MI:D.km, tick=tot>60?20:10;
  for(let v=0;v<=tot+0.01;v+=tick){ const k=imperial?v/KM_MI:v; g+=`<text x="${x(k).toFixed(1)}" y="${H-4}" text-anchor="middle">${v}</text>`; }
  let done="";
  if(opts.pos!=null){ const px=x(Math.min(opts.pos,D.km)); done=`<rect class="done" x="${pl}" y="${pt}" width="${(px-pl).toFixed(1)}" height="${H-pt-pb}"/><line class="me" x1="${px.toFixed(1)}" x2="${px.toFixed(1)}" y1="${pt}" y2="${H-pb}"/>`; }
  const mk=STOPS.filter(s=>s.d===D.n&&(s.src!=="S"||((s.off||0)<1&&!s.c.includes("bike")&&!s.c.includes("bed"))))
    .map(s=>{const i=Math.round(s.k/D.km*100);return `<circle class="mk ${markClass(s)}" cx="${x(s.k).toFixed(1)}" cy="${y(D.prof[Math.min(100,i)]).toFixed(1)}" r="4"><title>${esc(s.n)}</title></circle>`}).join("");
  return `<svg class="profile" viewBox="0 0 ${W} ${H}" role="img" aria-label="Elevation profile day ${D.n}">${g}<path class="area" d="${area}"/>${done}<path class="line" d="${line}"/>${mk}</svg>`;
}
function remainingGain(D,k){
  let pg=0,rg=0; const i0=Math.round(k/D.km*100);
  for(let i=1;i<=100;i++){const dd=D.prof[i]-D.prof[i-1]; if(dd>0){pg+=dd; if(i>i0) rg+=dd;}}
  return pg? rg*D.gain/pg : 0;
}
const legend=`<div class="tags"><span class="tag water">● Water</span><span class="tag food">● Food</span><span class="tag camp">● Sleep</span></div>`;

/* ---------- views ---------- */
function renderNow(){
  const D=DAYS[day-1]; posKm=Math.min(posKm,D.km);
  const here=D.cum+posKm;
  const ahead=STOPS.filter(s=>s.cum>here+0.05);
  const nextOf=(pred)=>ahead.find(pred);
  const water=nextOf(s=>s.c.includes("water")&&s.wq==="ok"&&(s.off||0)<=6.5);
  const food=nextOf(s=>s.c.includes("food")&&(s.off||0)<=6.5);
  const sleep=STOPS.find(s=>s.d===day&&s.night&&s.cum>here-0.05);
  const nx=(cls,label,s)=>{ if(!s) return `<div class="nx ${cls}"><div class="ic">${ICON[cls]}</div><div class="t"><b>${label}</b><span>Nothing left before the finish</span></div><div class="d">–</div></div>`;
    const d=s.cum-here; const alarm=cls!=="s"&&d>40;
    return `<div class="nx ${cls}${alarm?" alarm":""}"><div class="ic">${ICON[cls]}</div><div class="t"><b>${esc(s.n)}</b><span>${label} · Day ${s.d}${s.off>=0.5?" · "+(imperial?fmt(s.off*KM_MI,1)+" mi":fmt(s.off,1)+" km")+" off route (straight line)":""}</span></div><div class="d">${s.approx?"≈":""}${distStack(d)}</div></div>`; };
  const upcoming=STOPS.filter(s=>s.cum>=here-0.05&&s.cum<=here+60&&!(s.c.length===1&&s.c[0]==="bike")).slice(0,8);
  const maxStep = imperial? D.km*KM_MI : D.km;
  const shown = imperial? posKm*KM_MI : posKm;
  document.getElementById("v-now").innerHTML=`
    <div class="eyebrow">Where are you?</div>
    <div class="chips" role="group" aria-label="Day">${DAYS.map(x=>`<button class="chip" data-day="${x.n}" aria-pressed="${x.n===day}">Day ${x.n}</button>`).join("")}</div>
    <div class="card">
      <div class="pos-row">
        <div class="stepper"><button id="pm" aria-label="Back 5">−</button></div>
        <div class="pos-val" id="pv">${fmt(shown,1)}<small>${imperial?"mi":"km"} of ${fmt(maxStep,1)}</small></div>
        <div class="stepper"><button id="pp" aria-label="Forward 5">+</button></div>
      </div>
      <input type="range" id="pos" min="0" max="${maxStep.toFixed(1)}" step="0.5" value="${shown.toFixed(1)}" aria-label="Position on the stage">
      <div class="hint">Set the distance from your bike computer/Komoot for day ${day}. ± jumps 5 ${imperial?"mi":"km"}.</div>
      ${profileSvg(D,{pos:posKm,h:120})}
      <div class="stats">
        <div class="stat"><div class="k">Left today</div><div class="v">${distStack(D.km-posKm)}</div></div>
        <div class="stat"><div class="k">Climb left</div><div class="v">${elevStack(remainingGain(D,posKm))}</div></div>
        <div class="stat"><div class="k">Elevation now</div><div class="v">${elevStack(D.prof[Math.round(posKm/D.km*100)])}</div></div>
      </div>
    </div>
    <div class="next">
      ${nx("w","Next drinking water",water)}
      ${nx("f","Next food",food)}
      ${sleep?nx("s",day===8?"Finish":"Sleep tonight",sleep):`<div class="night"><b>Night ${day}</b>${esc(META[day].night)}</div>`}
    </div>
    ${sleep?`<div class="night"><b>Night ${day}</b>${esc(META[day].night)}</div>`:""}
    <div class="card"><div class="eyebrow">Next ${imperial?"37 mi":"60 km"}</div>
      <div class="log">${upcoming.length?upcoming.map(s=>stopHtml(s)).join(""):'<p class="sub">No stops on this stretch.</p>'}</div></div>`;
  const v=document.getElementById("v-now");
  v.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{day=+b.dataset.day;posKm=0;save();renderNow()});
  const r=v.querySelector("#pos");
  r.oninput=()=>{v.querySelector("#pv").firstChild.nodeValue=fmt(+r.value,1)};
  r.onchange=()=>{posKm=imperial?r.value/KM_MI:+r.value; save(); renderNow(); document.getElementById("pos").focus()};
  const stepBy=n=>{posKm=Math.max(0,Math.min(D.km,posKm+n*(imperial?1/KM_MI:1)));save();renderNow()};
  v.querySelector("#pm").onclick=()=>stepBy(-5); v.querySelector("#pp").onclick=()=>stepBy(5);
}

function renderDays(){
  const tot=DAYS.reduce((a,d)=>a+d.km,0), gain=DAYS.reduce((a,d)=>a+d.gain,0);
  document.getElementById("v-days").innerHTML=`
    <div class="card"><h1 class="big-h">8 Stages</h1>
      <div class="stats">
        <div class="stat"><div class="k">Distance</div><div class="v">${distStack(tot)}</div></div>
        <div class="stat"><div class="k">Climbing</div><div class="v">${elevStack(gain)}</div></div>
        <div class="stat"><div class="k">Highest point</div><div class="v">${elevStack(Math.max(...DAYS.map(d=>d.max)))}</div></div>
      </div>
      <div class="hint">From the provisional GPX tracks. Laura's guide uses 623 km (387 mi), so guide distances and your bike computer may differ.</div>
      ${legend}
    </div>
    ${DAYS.map(D=>{const M=META[D.n]; const ss=STOPS.filter(s=>s.d===D.n);
      return `<article class="card stage" id="tag${D.n}">
      <div class="stage-head"><h2>Day ${D.n}</h2><span class="n">${dist(D.km)}</span></div>
      <div class="route">${esc(M.from)} → ${esc(M.to)}</div>
      <div class="stats">
        <div class="stat"><div class="k">Climb</div><div class="v">${elevStack(D.gain)}</div></div>
        <div class="stat"><div class="k">Descent</div><div class="v">${elevStack(D.loss)}</div></div>
        <div class="stat"><div class="k">Max elevation</div><div class="v">${elevStack(D.max)}</div></div>
      </div>
      ${profileSvg(D)}
      <div class="night"><b>Night ${D.n}</b>${esc(M.night)}</div>
      <details class="more"><summary>${ss.length} stops on this day</summary><div class="log">${ss.map(s=>stopHtml(s)).join("")}</div></details>
      <button class="chip" data-go="${D.n}" style="align-self:flex-start">Open day ${D.n} in On the road</button>
    </article>`}).join("")}`;
  document.querySelectorAll("#v-days [data-go]").forEach(b=>b.onclick=()=>{day=+b.dataset.go;posKm=0;setView("now")});
}

function renderStops(){
  const F=[["all","All"],["water","Water"],["food","Food"],["camp","Camping"],["bed","Lodging"],["bike","Bike shops"]];
  const list=STOPS.filter(s=>filter==="all"||s.c.includes(filter)&&!(filter==="water"&&s.wq==="no"));
  let html=`<div class="filters" role="group" aria-label="Filter">${F.map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join("")}</div>`;
  for(const D of DAYS){ const ss=list.filter(s=>s.d===D.n); if(!ss.length) continue;
    html+=`<div class="card"><div class="stage-head"><h2 style="font-size:24px">Day ${D.n}</h2><span class="sub">${esc(META[D.n].from)} → ${esc(META[D.n].to)}</span></div><div class="log">${ss.map(s=>stopHtml(s)).join("")}</div></div>`; }
  html+=`<p class="hint">Left column: distance within the day (GPX). “Guide” = official rally distance from Laura's resupply guide. ≈ = estimated position. “Off route” distances are straight-line from the nearest point on the track; the ride there is longer.</p>`;
  document.getElementById("v-stops").innerHTML=html;
  document.querySelectorAll("#v-stops [data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;save();renderStops()});
}

function renderInfo(){
  const gaps=[
    ["Circle K (D1) → San Manuel (D2)","Food & water, incl. night 1",75],
    ["Vail (D3) → Sonoita (D4)","Food & water, incl. night 3",80],
    ["Patagonia (D4) → Pilot Rio Rico (D6)","Food, incl. nights 4 & 5",126],
    ["Parker Canyon Lake (D5) → Pilot Rio Rico (D6)","Water",71],
    ["Pilot Rio Rico (D6) → Arivaca (D7)","Water, incl. dry night 6",57]
  ];
  document.getElementById("v-info").innerHTML=`
    <div class="alert"><b class="h">Water safety: read before the ride</b><ul>
      <li>Carry at least <b>3 L (≈ 100 fl oz)</b> on the bike at all times, plus extra bottles for electrolytes.</li>
      <li>Filtering natural water is mostly <b>not an option</b>: creeks around Patagonia (Harshaw Creek, Sonoita Creek tributaries, Alum Gulch, Flux Canyon) carry acid mine drainage with heavy metals. Standard filters don't remove dissolved metals.</li>
      <li><b>Peña Blanca Lake</b> (next to the night 6 camp) is mercury-contaminated. Don't drink it, even filtered or treated.</li>
      <li>Dry nights: <b>1</b>, <b>2</b> (Molino Basin), <b>3</b>, <b>4</b> and <b>6</b> (Peña Blanca). Carry water for evening and morning.</li>
    </ul></div>
    <div class="card"><div class="eyebrow">Long gaps without resupply</div>
      ${gaps.map(([a,b,km])=>`<div class="gap-row"><div><b>${a}</b><div class="sub">${b}</div></div><div class="d">${distStack(km)}</div></div>`).join("")}
      <div class="hint">Distances from Laura's guide (official rally route); last row estimated from the GPX.</div>
    </div>
    <div class="alert w"><b class="h">Cash & cell signal</b><ul>
      <li>Bring small bills for self-pay camps: Peppersauce ($15 cash), Parker Canyon ($20), Peña Blanca ($15), General Hitchcock.</li>
      <li>No or little signal: Peppersauce Canyon, Mt Lemmon (patchy), Parker Canyon Lake. This app works fully offline once installed (see below).</li>
      <li>US emergency number: <b>911</b>. Near the border (days 6–7) expect lots of Border Patrol. Carry your passport/ID.</li>
    </ul></div>
    <div class="card"><div class="eyebrow">Conversions</div>
      <div class="stats">
        <div class="stat"><div class="k">1 mi</div><div class="v">1.61 km</div></div>
        <div class="stat"><div class="k">1,000 ft</div><div class="v">305 m</div></div>
        <div class="stat"><div class="k">1 L</div><div class="v">34 fl oz</div></div>
        <div class="stat"><div class="k">10 km</div><div class="v">6.2 mi</div></div>
        <div class="stat"><div class="k">1,000 m</div><div class="v">3,281 ft</div></div>
        <div class="stat"><div class="k">30 °C</div><div class="v">86 °F</div></div>
      </div>
      <div class="hint">°F → °C: (°F − 32) × 5/9. 100 °F ≈ 38 °C, 40 °F ≈ 4 °C.</div>
    </div>
    <div class="card"><div class="eyebrow">About this data</div>
      <p class="sub" style="margin:0">Stages, elevation profiles and daily distances come from the provisional Komoot GPX tracks (as of Sep 10, 2026). Stops come from Laura's resupply guide (GRL PCK) and your planning sheet. Check opening hours and prices locally, and call small stores ahead.</p>
      <p class="sub" style="margin:0">Offline: open this page once with internet, then add it to your home screen (iPhone: Safari → Share → Add to Home Screen; Android: Chrome → ⋮ → Install app). After that it works without signal. Your unit choice and current distance are remembered on this device. <b>${offlineMsg()}</b></p>
    </div>`;
}

const R={now:renderNow,days:renderDays,stops:renderStops,info:renderInfo};
function setView(v){ view=v; save();
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));
  document.querySelectorAll("section.view").forEach(s=>s.hidden=s.id!=="v-"+v);
  R[v](); window.scrollTo(0,0); }
function renderAll(){ document.getElementById("u-metric").setAttribute("aria-pressed",!imperial); document.getElementById("u-imp").setAttribute("aria-pressed",imperial); R[view](); }
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>setView(b.dataset.v));
document.getElementById("u-metric").onclick=()=>{imperial=false;save();renderAll()};
document.getElementById("u-imp").onclick=()=>{imperial=true;save();renderAll()};
const h=location.hash.slice(1); if(R[h]) view=h;
setView(view); renderAll();
</script>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(typeof view!=="undefined"&&view==="info")renderInfo()});
}
</script>
</body>
</html>
